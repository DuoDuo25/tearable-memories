<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HTML in Canvas — Tearable UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d0f;font-family:'Inter','Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{cursor:grab}
body.grabbing{cursor:grabbing}
body.scissors{cursor:crosshair}
canvas{display:block;position:fixed;top:0;left:0}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud.tl{top:22px;left:22px;max-width:60vw}
.hud.tr{top:22px;right:22px;text-align:right}
.hud.bl{bottom:22px;left:22px;max-width:380px}
.hud.br{bottom:22px;right:22px;text-align:right}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);border-radius:999px;font-size:11px;font-weight:700;color:#0d0d0f;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
.meta{margin-top:10px;font-size:12px;color:rgba(13,13,15,.62);line-height:1.5;font-weight:500;mix-blend-mode:difference;color:rgba(255,255,255,.7)}
.meta a{color:#fff;text-decoration:underline;pointer-events:auto}
.meta strong{color:#fff;font-weight:700}
.btn{pointer-events:auto;padding:9px 16px;background:#0d0d0f;color:#fff;border:none;border-radius:999px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:transform .15s,background .15s}
.btn:hover{background:#1a1a1f;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:rgba(255,255,255,.85);color:#0d0d0f;border:1px solid rgba(0,0,0,.08)}
.btn.ghost:hover{background:#fff}
.layer-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(13,13,15,.85);color:#fff;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.layer-pill .num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:#fff;color:#0d0d0f;border-radius:50%;font-size:10px;font-weight:800}
.tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;font-size:13px;font-weight:500;color:rgba(13,13,15,.45);letter-spacing:.04em;animation:fadeOut 5s 1.5s forwards;z-index:5;text-align:center;mix-blend-mode:difference;color:rgba(255,255,255,.4)}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.spec-link{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);pointer-events:auto;z-index:10;font-size:10px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;mix-blend-mode:difference;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.spec-link:hover{color:#fff;border-color:rgba(255,255,255,.4)}
#boot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0d0d0f;color:#fff;font-family:'Space Grotesk','Inter',sans-serif;transition:opacity .5s ease}
.boot-inner{text-align:center;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.boot-spinner{width:32px;height:32px;border:2px solid rgba(255,255,255,.15);border-top-color:rgba(255,255,255,.85);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .hud.tl{top:14px;left:14px;max-width:none;right:14px}
  .hud.tr{top:14px;right:14px}
  .hud.br{bottom:14px;right:14px}
  .meta{display:none}
  .badge{padding:5px 10px;font-size:9px;letter-spacing:.06em}
  .btn{padding:6px 11px;font-size:9px}
  .layer-pill{padding:5px 10px;font-size:9px;letter-spacing:.06em}
  .layer-pill .num{width:15px;height:15px;font-size:8px}
  .spec-link{display:none}
  .tip{font-size:11px}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-spinner"></div>
    <div id="boot-msg">Loading memories…</div>
  </div>
</div>


<script>
'use strict';

// ============================================================
//  HTML in Canvas — Tearable UI Demo
//  Verlet cloth physics + textured-triangle Canvas 2D rendering
// ============================================================

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
const isMobile = window.matchMedia('(max-width: 640px)').matches
              || ('ontouchstart' in window && window.innerWidth < 900);
// Cap dpr at 2.5 — high enough for retina sharpness on mobile (devicePixelRatio
// is usually 3 on iPhones), low enough to keep textured-triangle rendering smooth.
const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

let W = 0, H = 0;        // backing-store size (in device pixels)
let CW = 0, CH = 0;      // CSS size (in css pixels)

function resize() {
  CW = window.innerWidth;
  CH = window.innerHeight;
  W = canvas.width = Math.floor(CW * dpr);
  H = canvas.height = Math.floor(CH * dpr);
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
}

// ---------- Seeded random (mulberry32) ----------
function makeRng(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ============================================================
//  Layer texture drawing
//  Each "layer" is a full-screen offscreen canvas drawn once.
//  We then warp it via verlet cloth to get the tearable effect.
// ============================================================

// Order matters: PHOTOS[0] is the BOTTOM-most layer (revealed last).
// PHOTOS[length-1] is what the user sees first.
const PHOTOS = [
  { // Bottom layer — final reveal
    src: 'photos/03-edinburgh.jpg',
    date: '2025-01-28',
    place: '@Edinburgh United Kingdom',
    img: null
  },
  { // Middle layer
    src: 'photos/02-rome.jpg',
    date: '2025-10-10',
    place: '@Rome Italy',
    img: null
  },
  { // Top layer — first thing user sees
    src: 'photos/01-lacha.jpg',
    date: '2026-04-29',
    place: '@Lacha Thailand',
    img: null
  }
];

function loadPhotos() {
  return Promise.all(PHOTOS.map((p) => new Promise((resolve, reject) => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => { p.img = img; resolve(); };
    img.onerror = () => reject(new Error('Failed to load ' + p.src));
    img.src = p.src;
  })));
}

function drawPhotoTexture(photo, idx, total) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');

  // 1. Photo as full-bleed background, cover-mode crop
  drawCover(x, photo.img, 0, 0, W, H);

  // 2. Subtle film-grain pass for cinema texture (very light)
  const grainCount = Math.floor((W * H) / 14000);
  for (let i = 0; i < grainCount; i++) {
    x.fillStyle = `rgba(255,255,255,${Math.random() * 0.025})`;
    x.fillRect(Math.random() * W, Math.random() * H, 1 * dpr, 1 * dpr);
  }

  // 3. Bottom gradient for caption legibility
  const grad = x.createLinearGradient(0, H * 0.55, 0, H);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0.78)');
  x.fillStyle = grad;
  x.fillRect(0, 0, W, H);

  // Caption — date (small/mono) above, place (large/italic) below
  const margin = Math.max(32 * dpr, W * 0.03);
  const baseY = H - margin * 1.2;

  x.textAlign = 'left';
  x.shadowColor = 'rgba(0,0,0,0.55)';
  x.shadowBlur = 10 * dpr;
  x.shadowOffsetY = 2 * dpr;

  // place name (large italic serif-ish)
  const placeSize = Math.min(W, H) * 0.052;
  x.font = `800 italic ${placeSize}px 'Inter', 'Helvetica Neue', sans-serif`;
  x.fillStyle = 'rgba(255,255,255,0.98)';
  x.textBaseline = 'alphabetic';
  x.fillText(photo.place, margin, baseY);

  // thin divider above the place name
  x.shadowBlur = 0; x.shadowOffsetY = 0;
  const placeMetrics = x.measureText(photo.place);
  const dividerY = baseY - placeSize * 1.05;
  x.strokeStyle = 'rgba(255,255,255,0.6)';
  x.lineWidth = 1.5 * dpr;
  x.beginPath();
  x.moveTo(margin, dividerY);
  x.lineTo(margin + Math.min(placeMetrics.width * 0.45, 180 * dpr), dividerY);
  x.stroke();

  // date (mono, above divider)
  const dateSize = Math.min(W, H) * 0.022;
  x.font = `600 ${dateSize}px 'Space Grotesk', 'JetBrains Mono', monospace`;
  x.fillStyle = 'rgba(255,255,255,0.92)';
  x.textBaseline = 'alphabetic';
  x.shadowColor = 'rgba(0,0,0,0.5)';
  x.shadowBlur = 6 * dpr;
  // format date with bullet separators for visual rhythm
  const niceDate = photo.date.replace(/-/g, ' · ');
  x.fillText(niceDate, margin, dividerY - dateSize * 0.6);
  x.shadowBlur = 0;

  return c;
}

// Cover-mode drawImage: scale the image to fill (dx,dy,dw,dh), crop overflow.
function drawCover(ctx, img, dx, dy, dw, dh) {
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = dw / dh;
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (ir > cr) {
    // image is wider than canvas — crop sides
    sw = img.naturalHeight * cr;
    sx = (img.naturalWidth - sw) / 2;
  } else {
    // image is taller than canvas — crop top/bottom
    sh = img.naturalWidth / cr;
    sy = (img.naturalHeight - sh) / 2;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function drawCornerLabels(x, p, sz) {
  x.font = `700 ${sz}px Inter, system-ui, sans-serif`;
  x.fillStyle = p.title;
  x.globalAlpha = 0.55;
  x.textAlign = 'right';
  x.textBaseline = 'top';
  x.fillText('© Tearable UI · 2026', W - 28 * dpr, 90 * dpr);

  x.textAlign = 'left';
  x.textBaseline = 'bottom';
  x.fillText('SCROLL · DRAG · TEAR', 28 * dpr, H - 90 * dpr);

  x.textAlign = 'right';
  x.textBaseline = 'bottom';
  x.fillText('LAYER ↘', W - 28 * dpr, H - 90 * dpr);
  x.globalAlpha = 1;
}

// ---------- Memphis decoration primitives ----------

function drawMemphisDecorations(x, w, h, palette, rng) {
  const margin = w * 0.04;

  // Big half-discs in 4 corners
  for (let i = 0; i < 4; i++) {
    const corner = [[0, 0], [w, 0], [w, h], [0, h]][i];
    const r = Math.min(w, h) * (0.08 + rng() * 0.05);
    x.fillStyle = palette[i % palette.length];
    x.beginPath();
    x.arc(corner[0], corner[1], r, 0, Math.PI * 2);
    x.fill();
  }

  // Squiggles
  for (let i = 0; i < 22; i++) {
    drawSquiggle(
      x,
      margin + rng() * (w - margin * 2),
      margin + rng() * (h - margin * 2),
      40 * dpr + rng() * 80 * dpr,
      4 * dpr + rng() * 3 * dpr,
      palette[Math.floor(rng() * palette.length)]
    );
  }

  // Dots
  for (let i = 0; i < 60; i++) {
    x.fillStyle = palette[Math.floor(rng() * palette.length)];
    x.globalAlpha = 0.85;
    x.beginPath();
    x.arc(rng() * w, rng() * h, 3 * dpr + rng() * 8 * dpr, 0, Math.PI * 2);
    x.fill();
  }
  x.globalAlpha = 1;

  // Triangles
  for (let i = 0; i < 14; i++) {
    drawTriangle(
      x,
      rng() * w,
      rng() * h,
      30 * dpr + rng() * 40 * dpr,
      rng() * Math.PI * 2,
      palette[Math.floor(rng() * palette.length)]
    );
  }

  // Zigzags
  for (let i = 0; i < 8; i++) {
    drawZigzag(
      x,
      rng() * w,
      rng() * h,
      80 * dpr + rng() * 120 * dpr,
      18 * dpr + rng() * 10 * dpr,
      4 * dpr,
      palette[Math.floor(rng() * palette.length)]
    );
  }

  // Crosses (plus signs)
  for (let i = 0; i < 16; i++) {
    drawCross(
      x,
      rng() * w,
      rng() * h,
      14 * dpr + rng() * 12 * dpr,
      4 * dpr,
      palette[Math.floor(rng() * palette.length)]
    );
  }

  // Concentric circles
  for (let i = 0; i < 5; i++) {
    drawConcentric(
      x,
      rng() * w,
      rng() * h,
      28 * dpr + rng() * 30 * dpr,
      3 * dpr,
      palette[Math.floor(rng() * palette.length)]
    );
  }

  // Outlined geometric panels (thin stroke rect + fill)
  for (let i = 0; i < 4; i++) {
    const px = rng() * (w - 200 * dpr);
    const py = rng() * (h - 100 * dpr);
    const pw = 80 * dpr + rng() * 120 * dpr;
    const ph = 50 * dpr + rng() * 60 * dpr;
    x.fillStyle = palette[Math.floor(rng() * palette.length)];
    x.globalAlpha = 0.18;
    x.fillRect(px, py, pw, ph);
    x.globalAlpha = 1;
    x.strokeStyle = palette[Math.floor(rng() * palette.length)];
    x.lineWidth = 2 * dpr;
    x.strokeRect(px, py, pw, ph);
  }
}

function drawSquiggle(x, cx, cy, len, lw, color) {
  x.strokeStyle = color;
  x.lineWidth = lw;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.beginPath();
  const segs = 16;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const px = cx + (t - 0.5) * len;
    const py = cy + Math.sin(t * Math.PI * 3) * (lw * 3);
    if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
  }
  x.stroke();
}

function drawTriangle(x, cx, cy, size, rot, color) {
  x.save();
  x.translate(cx, cy);
  x.rotate(rot);
  x.fillStyle = color;
  x.beginPath();
  x.moveTo(0, -size * 0.6);
  x.lineTo(size * 0.55, size * 0.45);
  x.lineTo(-size * 0.55, size * 0.45);
  x.closePath();
  x.fill();
  x.restore();
}

function drawZigzag(x, cx, cy, len, amp, lw, color) {
  x.strokeStyle = color;
  x.lineWidth = lw;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.beginPath();
  const segs = 8;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const px = cx + (t - 0.5) * len;
    const py = cy + ((i % 2 === 0) ? -amp : amp) * 0.5;
    if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
  }
  x.stroke();
}

function drawCross(x, cx, cy, size, lw, color) {
  x.strokeStyle = color;
  x.lineWidth = lw;
  x.lineCap = 'round';
  x.beginPath();
  x.moveTo(cx - size, cy); x.lineTo(cx + size, cy);
  x.moveTo(cx, cy - size); x.lineTo(cx, cy + size);
  x.stroke();
}

function drawConcentric(x, cx, cy, size, lw, color) {
  x.strokeStyle = color;
  x.lineWidth = lw;
  for (let r = size; r > 0; r -= size / 4) {
    x.beginPath();
    x.arc(cx, cy, r, 0, Math.PI * 2);
    x.stroke();
  }
}

// ============================================================
//  Cloth — Verlet integration with tearable structural constraints
// ============================================================

class Cloth {
  constructor(cols, rows, w, h, texture) {
    this.cols = cols;
    this.rows = rows;
    this.texW = w;
    this.texH = h;
    this.texture = texture;

    this.points = new Array(cols * rows);
    this.constraints = [];

    const dx = w / (cols - 1);
    const dy = h / (rows - 1);

    for (let r = 0; r < rows; r++) {
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        const px = cIdx * dx;
        const py = r * dy;
        const onEdge = (cIdx === 0 || cIdx === cols - 1 || r === 0 || r === rows - 1);
        this.points[r * cols + cIdx] = {
          x: px, y: py,
          ox: px, oy: py,
          tx: px, ty: py,         // texture coords (rest position)
          pinned: onEdge,
          edge: onEdge,
          brokenLinks: 0,
          alive: true
        };
      }
    }

    for (let r = 0; r < rows; r++) {
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        const i = r * cols + cIdx;
        if (cIdx < cols - 1) {
          this.constraints.push({ a: i, b: i + 1, len: dx, broken: false });
        }
        if (r < rows - 1) {
          this.constraints.push({ a: i, b: i + cols, len: dy, broken: false });
        }
      }
    }

    // tear thresholds
    this.breakRatio = 1.7;     // constraint breaks when stretched > 1.7x rest length
    this.gravity = 1300 * dpr;
    this.damping = 0.985;
    this.iterations = 4;
  }

  update(dt) {
    const g = this.gravity;
    const damp = this.damping;
    const dt2 = dt * dt;

    // verlet step
    for (let i = 0; i < this.points.length; i++) {
      const p = this.points[i];
      if (p.pinned) { p.ox = p.x; p.oy = p.y; continue; }
      const vx = (p.x - p.ox) * damp;
      const vy = (p.y - p.oy) * damp;
      p.ox = p.x;
      p.oy = p.y;
      p.x += vx;
      p.y += vy + g * dt2;
    }

    // constraint solving
    const points = this.points;
    for (let it = 0; it < this.iterations; it++) {
      const cs = this.constraints;
      for (let k = 0; k < cs.length; k++) {
        const c = cs[k];
        if (c.broken) continue;
        const a = points[c.a];
        const b = points[c.b];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        if (d > c.len * this.breakRatio) {
          c.broken = true;
          a.brokenLinks++;
          b.brokenLinks++;
          continue;
        }
        const diff = (d - c.len) / d * 0.5;
        const ox = dx * diff;
        const oy = dy * diff;
        if (!a.pinned) { a.x += ox; a.y += oy; }
        if (!b.pinned) { b.x -= ox; b.y -= oy; }
      }
    }

    // unpin border points whose inward neighbor tore away — lets torn chunks fall.
    // edge=true means it was originally an anchored border point (not a user grab).
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pinned && p.edge && p.brokenLinks >= 1) p.pinned = false;
    }
  }

  // Find the closest free point near (x,y), within radius.
  pick(x, y, radius) {
    let best = null;
    let bestD = radius * radius;
    for (let i = 0; i < this.points.length; i++) {
      const p = this.points[i];
      if (!p.alive) continue;
      const dx = p.x - x;
      const dy = p.y - y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  // How "torn" is the cloth, 0..1
  tornRatio() {
    let broken = 0;
    for (let i = 0; i < this.constraints.length; i++) {
      if (this.constraints[i].broken) broken++;
    }
    return broken / this.constraints.length;
  }

  // Draw a soft drop-shadow silhouette below the cloth so torn edges
  // look like real paper sitting above the underlayer.
  renderShadow(ctx) {
    const cols = this.cols;
    const rows = this.rows;
    const pts = this.points;
    const maxStretch = 3.0;
    const off = 8 * dpr;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    for (let r = 0; r < rows - 1; r++) {
      for (let cIdx = 0; cIdx < cols - 1; cIdx++) {
        const i00 = r * cols + cIdx;
        const p00 = pts[i00];
        const p01 = pts[i00 + 1];
        const p10 = pts[i00 + cols];
        const p11 = pts[i00 + cols + 1];
        if (triangleOk(p00, p01, p10, maxStretch)) {
          ctx.moveTo(p00.x + off, p00.y + off);
          ctx.lineTo(p01.x + off, p01.y + off);
          ctx.lineTo(p10.x + off, p10.y + off);
          ctx.closePath();
        }
        if (triangleOk(p01, p11, p10, maxStretch)) {
          ctx.moveTo(p01.x + off, p01.y + off);
          ctx.lineTo(p11.x + off, p11.y + off);
          ctx.lineTo(p10.x + off, p10.y + off);
          ctx.closePath();
        }
      }
    }
    ctx.filter = 'blur(' + (4 * dpr) + 'px)';
    ctx.fill();
    ctx.restore();
  }

  render(ctx) {
    const cols = this.cols;
    const rows = this.rows;
    const pts = this.points;
    const tex = this.texture;
    const maxStretch = 3.0;  // skip drawing absurdly stretched triangles

    for (let r = 0; r < rows - 1; r++) {
      for (let cIdx = 0; cIdx < cols - 1; cIdx++) {
        const i00 = r * cols + cIdx;
        const i01 = i00 + 1;
        const i10 = i00 + cols;
        const i11 = i10 + 1;
        const p00 = pts[i00];
        const p01 = pts[i01];
        const p10 = pts[i10];
        const p11 = pts[i11];

        // Triangle 1: p00, p01, p10
        if (triangleOk(p00, p01, p10, maxStretch)) {
          drawTexturedTriangle(
            ctx, tex,
            p00.tx, p00.ty, p01.tx, p01.ty, p10.tx, p10.ty,
            p00.x, p00.y, p01.x, p01.y, p10.x, p10.y
          );
        }
        // Triangle 2: p01, p11, p10
        if (triangleOk(p01, p11, p10, maxStretch)) {
          drawTexturedTriangle(
            ctx, tex,
            p01.tx, p01.ty, p11.tx, p11.ty, p10.tx, p10.ty,
            p01.x, p01.y, p11.x, p11.y, p10.x, p10.y
          );
        }
      }
    }
  }
}

function triangleOk(a, b, c, maxStretch) {
  const restAB = Math.hypot(b.tx - a.tx, b.ty - a.ty);
  const restBC = Math.hypot(c.tx - b.tx, c.ty - b.ty);
  const restCA = Math.hypot(a.tx - c.tx, a.ty - c.ty);
  const ab = Math.hypot(b.x - a.x, b.y - a.y);
  const bc = Math.hypot(c.x - b.x, c.y - b.y);
  const ca = Math.hypot(a.x - c.x, a.y - c.y);
  if (ab > restAB * maxStretch) return false;
  if (bc > restBC * maxStretch) return false;
  if (ca > restCA * maxStretch) return false;
  return true;
}

// ---------- Affine textured triangle (Canvas 2D trick) ----------
// `overdraw` slightly enlarges the clip region around the triangle's centroid
// so adjacent triangles overlap by ~0.5 device pixels. Eliminates faint seams.
const TRI_OVERDRAW = 0.6;
function drawTexturedTriangle(
  ctx, img,
  sx0, sy0, sx1, sy1, sx2, sy2,
  dx0, dy0, dx1, dy1, dx2, dy2
) {
  ctx.save();
  // Expand triangle outward from its centroid by TRI_OVERDRAW px to kill seams.
  const ccx = (dx0 + dx1 + dx2) / 3;
  const ccy = (dy0 + dy1 + dy2) / 3;
  const o = TRI_OVERDRAW;
  let ex0 = dx0, ey0 = dy0, ex1 = dx1, ey1 = dy1, ex2 = dx2, ey2 = dy2;
  let v0x = dx0 - ccx, v0y = dy0 - ccy;
  let v1x = dx1 - ccx, v1y = dy1 - ccy;
  let v2x = dx2 - ccx, v2y = dy2 - ccy;
  let l0 = Math.hypot(v0x, v0y); if (l0 > 0.01) { ex0 = ccx + v0x * (1 + o / l0); ey0 = ccy + v0y * (1 + o / l0); }
  let l1 = Math.hypot(v1x, v1y); if (l1 > 0.01) { ex1 = ccx + v1x * (1 + o / l1); ey1 = ccy + v1y * (1 + o / l1); }
  let l2 = Math.hypot(v2x, v2y); if (l2 > 0.01) { ex2 = ccx + v2x * (1 + o / l2); ey2 = ccy + v2y * (1 + o / l2); }

  ctx.beginPath();
  ctx.moveTo(ex0, ey0);
  ctx.lineTo(ex1, ey1);
  ctx.lineTo(ex2, ey2);
  ctx.closePath();
  ctx.clip();

  // Solve for the affine transform M such that:
  //   M * (sx_i, sy_i, 1)^T = (dx_i, dy_i)
  const denom = sx0 * (sy2 - sy1) + sx1 * (sy0 - sy2) + sx2 * (sy1 - sy0);
  if (denom === 0) { ctx.restore(); return; }
  const inv = 1 / denom;
  const m11 = (dx0 * (sy2 - sy1) + dx1 * (sy0 - sy2) + dx2 * (sy1 - sy0)) * inv;
  const m12 = (dy0 * (sy2 - sy1) + dy1 * (sy0 - sy2) + dy2 * (sy1 - sy0)) * inv;
  const m21 = (dx0 * (sx1 - sx2) + dx1 * (sx2 - sx0) + dx2 * (sx0 - sx1)) * inv;
  const m22 = (dy0 * (sx1 - sx2) + dy1 * (sx2 - sx0) + dy2 * (sx0 - sx1)) * inv;
  const dx  = (dx0 * (sx2 * sy1 - sx1 * sy2) + dx1 * (sx0 * sy2 - sx2 * sy0) + dx2 * (sx1 * sy0 - sx0 * sy1)) * inv;
  const dy  = (dy0 * (sx2 * sy1 - sx1 * sy2) + dy1 * (sx0 * sy2 - sx2 * sy0) + dy2 * (sx1 * sy0 - sx0 * sy1)) * inv;

  ctx.transform(m11, m12, m21, m22, dx, dy);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

// ============================================================
//  Scene management
// ============================================================

const TOP_COLS = isMobile ? 20 : 36;
const TOP_ROWS = isMobile ? 14 : 22;

let layers = [];      // active layers (cloth instances), stack: layers[0] is bottom-most
let currentTopIdx = 0;

function buildScene() {
  layers = [];
  for (let i = 0; i < PHOTOS.length; i++) {
    const tex = drawPhotoTexture(PHOTOS[i], i, PHOTOS.length);
    const cloth = new Cloth(TOP_COLS, TOP_ROWS, W, H, tex);
    layers.push(cloth);
  }
  currentTopIdx = layers.length - 1;
  updateLayerLabel();
}

function updateLayerLabel() { /* HUD removed; no-op kept so callers stay clean */ }

// ============================================================
//  Input — soft-brush grab (multi-point drag with falloff)
// ============================================================

const grab = {
  active: false,
  affected: [],   // [{ p, w }]  — all points being moved by the cursor
  lastX: 0,
  lastY: 0
};

const GRAB_RADIUS = 110;   // CSS-px radius around cursor that gets pulled

function getEventPos(e) {
  const t = e.touches ? e.touches[0] : e;
  return {
    x: t.clientX * dpr,
    y: t.clientY * dpr
  };
}

function onDown(e) {
  e.preventDefault();
  if (currentTopIdx < 0) return;
  const top = layers[currentTopIdx];
  if (!top) return;
  const pos = getEventPos(e);
  const radius = GRAB_RADIUS * dpr;
  const r2 = radius * radius;

  grab.affected.length = 0;
  for (let i = 0; i < top.points.length; i++) {
    const p = top.points[i];
    if (p.edge) continue;            // never grab anchored border points
    if (!p.alive) continue;
    const dx = p.x - pos.x;
    const dy = p.y - pos.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < r2) {
      const d = Math.sqrt(d2);
      // Linear falloff with floor: even brush-edge points still drag substantially,
      // so the boundary between grabbed cluster and stationary cloth stretches a lot
      // (which is what causes constraints to actually break).
      const t = d / radius;
      const w = Math.max(0.55, 1 - t * 0.7);
      p.pinned = true;
      grab.affected.push({ p, w });
    }
  }

  if (grab.affected.length === 0) return;

  grab.active = true;
  grab.lastX = pos.x;
  grab.lastY = pos.y;
  document.body.classList.add('grabbing');
}

function onMove(e) {
  if (!grab.active) return;
  const pos = getEventPos(e);
  const dx = pos.x - grab.lastX;
  const dy = pos.y - grab.lastY;
  grab.lastX = pos.x;
  grab.lastY = pos.y;

  // Apply weighted displacement to all grabbed points
  for (let i = 0; i < grab.affected.length; i++) {
    const { p, w } = grab.affected[i];
    p.x += dx * w;
    p.y += dy * w;
  }

  // Scissors cursor hint when tearing intensifies
  if (currentTopIdx >= 0) {
    const torn = layers[currentTopIdx].tornRatio();
    document.body.classList.toggle('scissors', torn > 0.05);
  }
}

function onUp() {
  if (!grab.active) return;
  // Release all held points so they fly away with their last frame's velocity
  for (let i = 0; i < grab.affected.length; i++) {
    grab.affected[i].p.pinned = false;
  }
  grab.affected.length = 0;
  grab.active = false;
  document.body.classList.remove('grabbing', 'scissors');
}

canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
window.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
window.addEventListener('touchend', onUp);
window.addEventListener('touchcancel', onUp);

// Reset via 'R' key (no on-screen button) — refresh the page also works.
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') buildScene();
});

// ============================================================
//  Animation loop
// ============================================================

let lastT = performance.now();

function frame(now) {
  let dt = (now - lastT) / 1000;
  if (dt > 1 / 30) dt = 1 / 30;     // clamp big spikes
  lastT = now;

  // physics (only on the visible top + on still-falling debris layers above top index)
  for (let i = 0; i < layers.length; i++) {
    if (i >= currentTopIdx) layers[i].update(dt);
  }

  // promote: top layer counts as "gone" once it's either heavily torn OR
  // most of its points have fallen off-screen.
  if (currentTopIdx > 0) {
    const top = layers[currentTopIdx];
    const pts = top.points;
    let off = 0;
    const xMin = -W * 0.05, xMax = W * 1.05;
    const yMin = -H * 0.05, yMax = H * 1.08;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p.x < xMin || p.x > xMax || p.y < yMin || p.y > yMax) off++;
    }
    const offRatio = off / pts.length;
    if (top.tornRatio() > 0.45 || offRatio > 0.45) {
      currentTopIdx--;
      updateLayerLabel();
    }
  }

  render();

  requestAnimationFrame(frame);
}

function render() {
  // Background fill (dark void — only visible if every layer tears completely)
  ctx.fillStyle = '#0d0d0f';
  ctx.fillRect(0, 0, W, H);

  // Layers below the current top haven't moved (no physics ran on them) —
  // blit their textures directly, much cheaper than per-triangle warping.
  for (let i = 0; i < currentTopIdx; i++) {
    ctx.drawImage(layers[i].texture, 0, 0);
  }

  // Drop shadows for the current top + debris, painted over the underlayer
  // so torn edges read as real paper sitting above the next layer.
  for (let i = currentTopIdx; i < layers.length; i++) {
    layers[i].renderShadow(ctx);
  }

  // Current top + any debris that used to be on top but already got demoted.
  for (let i = currentTopIdx; i < layers.length; i++) {
    layers[i].render(ctx);
  }

  // Soft vignette
  const grad = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.45,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.78
  );
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ============================================================
//  Init
// ============================================================

async function init() {
  resize();
  try {
    await loadPhotos();
  } catch (err) {
    console.error(err);
    document.getElementById('boot-msg').textContent = '照片加载失败：' + err.message;
    return;
  }
  document.getElementById('boot').style.opacity = '0';
  setTimeout(() => { const b = document.getElementById('boot'); if (b) b.style.display = 'none'; }, 600);
  buildScene();
  requestAnimationFrame(frame);
}
init();

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resize();
    buildScene();
  }, 150);
});

// Prevent context menu (cleaner UX while dragging)
window.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
